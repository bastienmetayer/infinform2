# /etc/nginx/sites-available/crazydev-preprod.conf
server {
    listen 80;
    server_name crazydev-preprod.sabneit.fr;

    # front de la release en ligne (lien mis à jour par deploy.sh)
    root /home/sabneit/crazydev/preprod/current/frontend;
    index accueil.html;

    # --- API FastAPI de l'environnement ---
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # --- Le front demande encore le fichier statique : on le redirige vers l'API ---
    location = /frontend/json/annonces.json {
        proxy_pass http://127.0.0.1:8001/api/annonces;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
    location = /json/annonces.json {
        proxy_pass http://127.0.0.1:8001/api/annonces;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # environnement de test : ne pas indexer par les moteurs de recherche
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
